<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Janus — decision engine cockpit</title>
    <meta name="description" content="Janus is a policy-bound decision engine for agentic systems: one request in, exactly one directive out, nothing executed. This is a frontend-only operator console on mock data; the engine is private." />
    <meta name="theme-color" content="#f8f8f6" />
    <link rel="preload" href="/fonts/HankenGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Janus — decision engine cockpit" />
    <meta property="og:description" content="Janus decides. Fabric acts. A policy-bound decision engine for agentic systems, shown through a frontend-only operator console on mock data." />
    <meta property="og:url" content="https://garthpuckerin-janus.vercel.app/" />
    <meta property="og:image" content="https://garthpuckerin-janus.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://garthpuckerin-janus.vercel.app/og.png" />
    <script>
      /* Apply a forced (?theme=dark) or stored theme/density BEFORE first paint
         so a returning visitor never sees one frame of the default. Mirrors
         src/utils/preferences.js; the hooks re-apply the same values on mount.
         Storage can be blocked — every access is guarded. */
      (function () {
        var root = document.documentElement;
        var pick = function (value, allowed) { return allowed.indexOf(value) === -1 ? null : value; };
        var stored = function (key) { try { return window.sessionStorage.getItem(key); } catch (e) { return null; } };
        var param = null;
        try { param = new URLSearchParams(window.location.search).get('theme'); } catch (e) { param = null; }
        var theme = pick(param, ['light', 'dark']) || pick(stored('janus:theme'), ['light', 'dark']);
        var density = pick(stored('janus:density'), ['comfortable', 'dense']);
        if (theme) root.setAttribute('data-theme', theme);
        if (density) root.setAttribute('data-density', density);

        /* The full desktop view on a small device is the REAL desktop, laid
           out at 1280 and scaled to the screen. Mirrors utils/surface.js
           (viewportContentFor); the hook re-applies it on mount. */
        var view = null;
        try { view = new URLSearchParams(window.location.search).get('view'); } catch (e) { view = null; }
        var forced = view === 'desktop' || stored('janus:surface') === 'desktop';
        var landscape = window.matchMedia ? window.matchMedia('(orientation: landscape)').matches : false;
        var sw = window.screen ? window.screen.width : 0;
        var sh = window.screen ? window.screen.height : 0;
        var device = sw > 0 && sh > 0 ? (landscape ? Math.max(sw, sh) : Math.min(sw, sh)) : Infinity;
        if (forced && device < 1024) {
          var meta = document.querySelector('meta[name="viewport"]');
          if (meta) meta.setAttribute('content', 'width=1280, viewport-fit=cover');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
